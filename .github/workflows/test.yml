name: Run Tests

on:
    push:
        branches: [db]
    pull_request:
        branches: [db]
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        env:
            LOGSEQ_API_SERVER: http://127.0.0.1:12315
            LOGSEQ_IMAGE: ghcr.io/debanjandhar12/docker-logseq:latest

        steps:
            - uses: actions/checkout@v6

            # Let Logseq initialize while the runner installs test dependencies.
            - name: Start latest Logseq DB container
              run: |
                  mkdir -p test-diagnostics
                  token=$(openssl rand -hex 32)
                  echo "::add-mask::$token"
                  echo "LOGSEQ_API_TOKEN=$token" >> "$GITHUB_ENV"
                  export LOGSEQ_API_TOKEN="$token"
                  docker pull "$LOGSEQ_IMAGE"
                  docker image inspect --format '{{json .RepoDigests}}' "$LOGSEQ_IMAGE" \
                    | tee test-diagnostics/image-digest.json
                  docker run -d --name logseq \
                    -e LOGSEQ_API_TOKEN \
                    -p 127.0.0.1:12315:12315 \
                    "$LOGSEQ_IMAGE"

            - name: Read tool versions from mise.toml
              id: tools
              run: |
                  python3 - <<'PY' >> "$GITHUB_OUTPUT"
                  import tomllib
                  with open("mise.toml", "rb") as config:
                      tools = tomllib.load(config)["tools"]
                  for tool in ("node", "pnpm"):
                      print(f"{tool}={tools[tool]}")
                  PY

            - uses: pnpm/action-setup@v4
              with:
                  version: ${{ steps.tools.outputs.pnpm }}

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ steps.tools.outputs.node }}
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install native canvas build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential python3 pkg-config \
                    libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Chromium
              run: pnpm exec playwright install --with-deps chromium

            - name: Wait for authenticated DB graph
              run: |
                  deadline=$((SECONDS + 180))
                  while (( SECONDS < deadline )); do
                    if [[ "$(docker inspect --format '{{.State.Running}}' logseq)" != true ]]; then
                      echo "::error::Logseq container exited before its DB graph was ready"
                      exit 1
                    fi
                    if curl --fail --silent --show-error --max-time 5 \
                        "$LOGSEQ_API_SERVER/api" \
                        -H 'Content-Type: application/json' \
                        -H "Authorization: Bearer $LOGSEQ_API_TOKEN" \
                        -d '{"method":"logseq.App.getCurrentGraph","args":[]}' \
                        -o test-diagnostics/graph-response.json \
                      && jq -e 'type == "object" and (.name | type == "string" and length > 0)' \
                        test-diagnostics/graph-response.json > /dev/null \
                      && curl --fail --silent --show-error --max-time 5 \
                        "$LOGSEQ_API_SERVER/api" \
                        -H 'Content-Type: application/json' \
                        -H "Authorization: Bearer $LOGSEQ_API_TOKEN" \
                        -d '{"method":"logseq.App.checkCurrentIsDbGraph","args":[]}' \
                        -o test-diagnostics/db-response.json \
                      && jq -e '. == true' test-diagnostics/db-response.json > /dev/null; then
                      echo "Authenticated Logseq DB graph is ready"
                      exit 0
                    fi
                    sleep 2
                  done
                  echo "::error::Authenticated Logseq DB graph was not ready within 180 seconds"
                  exit 1

            - name: Run unit and e2e tests
              id: tests
              # Files share one disposable graph, so graph-wide assertions need isolation.
              run: |
                  pnpm exec vitest run \
                    --project=unit --project=e2e \
                    --no-file-parallelism \
                    --reporter=default --reporter=html \
                    --outputFile.html=.vitest/index.html

            - name: Package HTML report
              id: report
              if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
              run: |
                  test -f .vitest/index.html
                  (cd .vitest && zip -r ../test-report.zip .)
                  unzip -t test-report.zip

            - name: Upload HTML report
              if: always() && steps.report.outcome == 'success'
              uses: actions/upload-artifact@v4
              with:
                  name: test-report
                  path: test-report.zip
                  if-no-files-found: error
                  retention-days: 14

            - name: Collect Logseq diagnostics
              if: always()
              run: |
                  mkdir -p test-diagnostics
                  if docker container inspect logseq > /dev/null 2>&1; then
                    docker logs logseq > test-diagnostics/logseq.log 2>&1
                    docker inspect --format '{{json .State}}' logseq > test-diagnostics/container-state.json
                  fi

            - name: Upload diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-diagnostics
                  path: test-diagnostics/
                  if-no-files-found: ignore
                  retention-days: 14

            - name: Remove Logseq container
              if: always()
              run: docker rm -f logseq || true
